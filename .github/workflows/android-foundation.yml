name: Android foundation checks
on:
  pull_request:
  push:
    branches: [main, "feature/android-native-foundation-20261021"]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android platform and native toolchain
        shell: bash
        run: |
          : "${ANDROID_HOME:?Android SDK must be present on the runner}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Check offline-only contract
        run: python3 tools/check_contract.py
      - name: Run C++ Blender file format framing tests
        run: |
          cmake -S native-tests -B "$RUNNER_TEMP/render-tests" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/render-tests" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/render-tests" --output-on-failure
      - name: Build and unit test Android foundation
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: render-android-foundation-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  blender-real-file-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop Blender only for generating genuine test fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender zstd
          blender --version | head -n 2
      - name: Generate genuine .blend scenes using Blender's own bpy
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/real-blender"
          blender -b -noaudio --python native-tests/create_real_blend_fixtures.py -- --output "$RUNNER_TEMP/real-blender"
      - name: Produce standard Zstd envelope around genuine Blender scene
        run: |
          zstd --quiet --force -o "$RUNNER_TEMP/real-blender/render_real_scene.blend.zst" \
            "$RUNNER_TEMP/real-blender/render_real_scene.blend"
      - name: Build Render's native scene-file diagnostic
        run: |
          cmake -S native-tests -B "$RUNNER_TEMP/native-compat" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/native-compat" --target blender_real_fixture_tests --parallel 2
      - name: Verify uncompressed, animated, gzip, Zstd and Blender-native compressed files
        run: |
          "$RUNNER_TEMP/native-compat/blender_real_fixture_tests" \
            "$RUNNER_TEMP/real-blender/render_real_scene.blend" \
            "$RUNNER_TEMP/real-blender/render_animated_scene.blend" \
            "$RUNNER_TEMP/real-blender/render_real_scene.blend.gz" \
            "$RUNNER_TEMP/real-blender/render_real_scene.blend.zst" \
            "$RUNNER_TEMP/real-blender/render_blender_compressed_scene.blend"
      - name: Archive fixture manifest (not production application assets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-blender-file-compatibility-manifest
          path: |
            ${{ runner.temp }}/real-blender/fixture_manifest.json
          if-no-files-found: warn
