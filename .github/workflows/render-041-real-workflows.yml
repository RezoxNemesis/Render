name: Render 0.41 External Video Artist Workflow Benchmarks
on:
  pull_request:
    branches: [upgrade/render-studio-040-viewport-fidelity-phase1-20261025]
    paths:
      - "full-app/scripts/**"
      - "app/src/**"
      - "tools/**"
      - ".github/workflows/render-041-real-workflows.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-and-packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile actual benchmark operations
        run: |
          python -m compileall -q full-app/scripts/render_workflow_contract.py \
            full-app/scripts/render_workflow_ops.py \
            full-app/scripts/render_unified_workspace.py \
            full-app/scripts/render_unified_contract.py \
            full-app/scripts/render_production.py
      - name: Validate external benchmark identity, injection rejection and registered operations
        run: |
          python -m unittest tools.test_external_benchmarks_contract -v
          python -m unittest tools.test_unified_studio_contract -v
          python -m unittest tools.test_agent_fastlane_contract -v
          python -m unittest tools.omega.test_phase10_packaging -v
      - name: Validate pinned native Blender runtime staging twice
        run: |
          python tools/prepare_production_toolkit.py
          python tools/prepare_production_toolkit.py
  real-editable-blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install genuine Blender bpy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
          blender --version | head -2
      - name: Verify actual mesh faces, linked copies, materials, rig keys/NLA, compositor, rigid-body, and ink geometry
        env:
          PYTHONPATH: full-app/scripts
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          blender -b -noaudio --python-exit-code 1 --python tools/test_real_workflow_benchmarks.py
  android-native-command-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          M="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$M"
          yes | "$M" --licenses >/dev/null || true
          "$M" --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Full native-target tests and bridge compilation
        run: |
          python tools/prepare_production_toolkit.py
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
