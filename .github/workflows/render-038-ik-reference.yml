name: Render 0.38 Real IK and Reference Timeline
on:
  pull_request:
    branches: [upgrade/render-studio-037-live-sculpt-acting-20261025]
    paths:
      - "full-app/scripts/**"
      - "app/src/**"
      - "tools/**"
      - ".github/workflows/render-038-ik-reference.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-contract-and-packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse native IK, movie sync and authenticated dispatcher
        run: |
          python -m compileall -q full-app/scripts/render_ik_control.py \
            full-app/scripts/render_ik_contract.py \
            full-app/scripts/render_reference_timeline.py \
            full-app/scripts/render_unified_workspace.py \
            full-app/scripts/render_unified_contract.py
      - name: Run strict IK/FK, serialization and native archive contracts
        run: |
          python -m unittest tools.test_ik_contract -v
          python -m unittest tools.test_unified_studio_contract -v
          python -m unittest tools.omega.test_phase10_packaging -v
      - name: Verify idempotent original native application staging
        run: |
          python tools/prepare_production_toolkit.py
          python tools/prepare_production_toolkit.py
  real-ik-blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install genuine Blender 4.x bpy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
          blender --version | head -2
      - name: Solve true 2-bone IK, key target, switch to FK and back
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYTHONPATH: full-app/scripts
        run: |
          blender -b -noaudio --python-exit-code 1 --python tools/test_real_ik_control.py
  real-video-blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install real Blender VSE and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender ffmpeg
      - name: Import SHA-verified original MP4 into Blender VSE and sync actual timeline
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYTHONPATH: full-app/scripts
        run: |
          blender -b -noaudio --python-exit-code 1 --python tools/test_real_reference_timeline.py
  windowed-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install live Blender GUI, Xvfb and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender xvfb ffmpeg
      - name: Show verified video and sampled frame next to editable 3D View
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYTHONPATH: full-app/scripts
        run: |
          timeout 120 xvfb-run -a -s "-screen 0 1280x900x24" \
            blender --factory-startup -noaudio --python-exit-code 1 \
            --python tools/test_real_reference_gui.py
  android-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Android NDK and build-tools prerequisites
        shell: bash
        run: |
          set -euo pipefail
          M="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$M"
          yes | "$M" --licenses >/dev/null || true
          "$M" --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Compile authenticated Render bridge and exercise Android JVM tests
        run: |
          python tools/prepare_production_toolkit.py
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
