name: Render Character Quality Gates — Actual Blender
on:
  pull_request:
    branches: [upgrade/render-studio-040-viewport-fidelity-phase1-20261025]
    paths:
      - "full-app/scripts/**"
      - "app/src/**"
      - "tools/**"
      - ".github/workflows/render-041-character-quality-gates.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality-contract-and-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check and strict read-only quality gate
        run: |
          python -m compileall -q full-app/scripts/render_character_quality_gates.py \
            full-app/scripts/render_unified_workspace.py full-app/scripts/render_production.py
          python -m unittest tools.test_character_quality_contract -v
          python -m unittest tools.test_unified_studio_contract -v
          python -m unittest tools.omega.test_phase10_packaging -v
      - name: Keep original Blender runtime staging idempotent
        run: |
          python tools/prepare_production_toolkit.py
          python tools/prepare_production_toolkit.py
  genuine-blender-character-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install genuine Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
          blender --version | head -2
      - name: Inspect disconnected real actor and safely rotate original reference
        env:
          PYTHONPATH: full-app/scripts
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          blender -b -noaudio --python-exit-code 1 --python tools/test_real_character_quality_gates.py
  android-operation-allowlist:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install native Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          M="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$M"
          yes | "$M" --licenses >/dev/null || true
          "$M" --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Android native command boundary and historical registry
        run: |
          python tools/prepare_production_toolkit.py
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
