name: Render MP4 recovery integrity
on:
  pull_request:
    branches: [upgrade/render-studio-031]
    paths:
      - "app/**"
      - "tools/**"
      - ".github/workflows/render-mp4-integrity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android compile prerequisites
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Verify existing production adapter without version or signer changes
        run: python3 tools/prepare_production_toolkit.py
      - name: Compile and run Android JVM regression tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-mp4-integrity-test-report
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
