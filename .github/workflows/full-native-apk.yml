name: Render Full Native Blender + Agent APK
on:
  push:
    branches: ["feature/android-native-foundation-20261021", "feature/lively-building-native-animation-20261022"]
    paths:
      - "full-app/**"
      - "app/src/main/java/**"
      - "app/src/main/cpp/**"
      - "app/build.gradle.kts"
      - "tools/test_blender_bpy_bridge.py"
      - "tools/test_lively_scene_contract.py"
      - "tools/test_real_blender_bpy.py"
      - "tools/assemble_full_native.py"
      - "tools/test_assemble_full_native.py"
      - ".github/workflows/full-native-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify full-engine staging rejects tampered files
        run: PYTHONPATH=tools python -m unittest tools/test_assemble_full_native.py tools/test_blender_bpy_bridge.py tools/test_lively_scene_contract.py -v

  blender-bpy-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install real Blender for bpy semantic compatibility test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
      - name: Verify typed native bpy commands with real Blender context
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: blender -b -noaudio --python-exit-code 1 --python tools/test_real_blender_bpy.py

  build-native-full:
    needs: stage-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build Render native JNI and ChatGPT agent first
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Download and verify pinned full native Blender engine APK
        shell: bash
        run: |
          curl -fL --retry 3 --connect-timeout 15 \
            "https://github.com/simfeo/blender/releases/download/android-alpha-4/blender-full.apk" \
            -o "$RUNNER_TEMP/blender-full.apk"
          echo "3fe775a1e14470ebfcd3c25ae32b57003433f04552f896880631ae98b1f18aea  $RUNNER_TEMP/blender-full.apk" | sha256sum --check --status
          test "$(stat -c%s "$RUNNER_TEMP/blender-full.apk")" = "286561495"
      - name: Retrieve pinned upstream Android Java and resources
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/full-blender-src"
          git -C "$RUNNER_TEMP/full-blender-src" init -q
          git -C "$RUNNER_TEMP/full-blender-src" remote add origin https://github.com/simfeo/blender.git
          git -C "$RUNNER_TEMP/full-blender-src" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/full-blender-src" sparse-checkout set build_files/android/apk/app/src/main
          git -C "$RUNNER_TEMP/full-blender-src" -c protocol.version=2 fetch --depth=1 --filter=blob:none origin d93bd33cba768e19ee4387a31c0ea137ee2f0047
          git -C "$RUNNER_TEMP/full-blender-src" checkout --detach -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/full-blender-src" rev-parse HEAD)" = "d93bd33cba768e19ee4387a31c0ea137ee2f0047"
      - name: Stage Render full engine plus native agent
        run: |
          python tools/assemble_full_native.py \
            --engine-apk "$RUNNER_TEMP/blender-full.apk" \
            --bridge-apk "app/build/outputs/apk/debug/app-debug.apk" \
            --upstream-source "$RUNNER_TEMP/full-blender-src" \
            --output "full-app/stage"
      - name: Prepare owner-protected stable release signing
        shell: bash
        env:
          SIGNING_B64: ${{ secrets.RENDER_ANDROID_SIGNING_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.RENDER_ANDROID_SIGNING_STORE_PASSWORD }}
          SIGN_ALIAS: ${{ secrets.RENDER_ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RENDER_ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_B64" ]]; then
            echo "Release signing secrets absent; debug APK only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$STORE_PASS" || -z "$SIGN_ALIAS" || -z "$KEY_PASS" ]]; then
            echo "Incomplete protected release signing secrets" >&2
            exit 1
          fi
          keyfile="$RUNNER_TEMP/render-studio-release.p12"
          printf "%s" "$SIGNING_B64" | base64 --decode > "$keyfile"
          chmod 600 "$keyfile"
          keytool -list -v -storetype PKCS12 -keystore "$keyfile" \
            -storepass "$STORE_PASS" -alias "$SIGN_ALIAS" \
            > "$RUNNER_TEMP/render-release-cert.txt"
          grep -Fq "03:01:F0:84:CB:37:45:7B:E8:23:53:A8:A0:7E:88:14:35:17:5B:FD:5B:F0:CF:EA:FA:2C:3D:D4:B2:5F:CF:57" \
            "$RUNNER_TEMP/render-release-cert.txt"
          echo "RENDER_ANDROID_SIGNING_STORE_FILE=$keyfile" >> "$GITHUB_ENV"
          echo "RENDER_STABLE_SIGNING_READY=1" >> "$GITHUB_ENV"

      - name: Compile full native engine + agent Android APK
        run: gradle -p full-app --no-daemon :app:assembleDebug
      - name: Verify engine, agent, runtime and signature
        shell: bash
        run: |
          APK=full-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tqq "$APK"
          unzip -Z -1 "$APK" | grep -Fx 'lib/arm64-v8a/libblender.so'
          unzip -Z -1 "$APK" | grep -Fx 'lib/arm64-v8a/librender_bridge.so'
          unzip -Z -1 "$APK" | grep -Fx 'assets/blender_runtime.zip'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/render-full-badging.txt"
          grep -q "package: name='com.rezox.render'" "$RUNNER_TEMP/render-full-badging.txt"
          grep -q "launchable-activity: name='com.rezox.render.RenderHubActivity'" "$RUNNER_TEMP/render-full-badging.txt"
          sha256sum "$APK" | tee "$RUNNER_TEMP/render-full-sha256.txt"
      - name: Compile stable signed release
        if: env.RENDER_STABLE_SIGNING_READY == '1'
        env:
          RENDER_ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.RENDER_ANDROID_SIGNING_STORE_PASSWORD }}
          RENDER_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.RENDER_ANDROID_SIGNING_KEY_PASSWORD }}
          RENDER_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.RENDER_ANDROID_SIGNING_KEY_ALIAS }}
        run: gradle -p full-app --no-daemon :app:assembleRelease

      - name: Verify owner certificate and release package
        if: env.RENDER_STABLE_SIGNING_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          APK=full-app/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -tqq "$APK"
          unzip -Z -1 "$APK" | grep -Fx "lib/arm64-v8a/libblender.so"
          unzip -Z -1 "$APK" | grep -Fx "lib/arm64-v8a/librender_bridge.so"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" \
            > "$RUNNER_TEMP/render-release-signature.txt"
          grep -Fqi "0301f084cb3745b8e82353a8a07e881435175bfd5bf0cfeafa2c3dd4b25fcf57" \
            "$RUNNER_TEMP/render-release-signature.txt"
          sha256sum "$APK" > "$RUNNER_TEMP/render-release-sha256.txt"
          echo "Owner release certificate verified. Retain the same keystore for updates." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: env.RENDER_STABLE_SIGNING_READY == '1'
        with:
          name: render-studio-owner-signed-native-blender-release
          path: full-app/app/build/outputs/apk/release/app-release.apk
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Erase signing keystore from the CI runner
        if: always()
        run: rm -f "$RUNNER_TEMP/render-studio-release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: render-full-native-blender-and-chatgpt-agent-debug
          path: full-app/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: render-full-native-build-provenance
          path: |
            ${{ runner.temp }}/render-full-badging.txt
            ${{ runner.temp }}/render-full-sha256.txt
          retention-days: 7
