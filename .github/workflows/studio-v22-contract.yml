name: Studio V22 reference and reliability contract
on:
  push:
    branches: [feature/022-reference-interaction-reliability-20261022]
    paths: ["full-app/scripts/render_studio_contract.py", "tools/test_studio_v22_contract.py", ".github/workflows/studio-v22-contract.yml"]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest tools/test_studio_v22_contract.py -v
