name: Render 0.39 ChatGPT Agent Fast Lane
on:
  pull_request:
    branches: [upgrade/render-studio-038-ik-reference-20261025]
    paths:
      - "full-app/scripts/**"
      - "app/src/**"
      - "tools/**"
      - ".github/workflows/render-039-agent-fastlane.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fastlane-host-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile fast lane and prior native modules
        run: |
          python -m compileall -q full-app/scripts/render_agent_fastlane.py \
            full-app/scripts/render_agent_fastlane_contract.py \
            full-app/scripts/render_unified_queue.py \
            full-app/scripts/render_unified_workspace.py
      - name: Verify bounded read-only batches, cache invalidation, plan reviews
        run: |
          python -m unittest tools.test_agent_fastlane_contract -v
          python -m unittest tools.test_unified_studio_contract -v
          python -m unittest tools.omega.test_phase10_packaging -v
      - name: Validate original Blender staging twice
        run: |
          python tools/prepare_production_toolkit.py
          python tools/prepare_production_toolkit.py
  fastlane-real-blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install real Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
          blender --version | head -2
      - name: Prove actual bpy session, command search, batched native reads and timings
        env:
          PYTHONPATH: full-app/scripts
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          blender -b -noaudio --python-exit-code 1 --python tools/test_real_agent_fastlane.py
  android-fast-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android prerequisites
        shell: bash
        run: |
          set -euo pipefail
          MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$MANAGER"
          yes | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Verify authenticated quick Android status and full existing native bridge
        run: |
          python tools/prepare_production_toolkit.py
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
