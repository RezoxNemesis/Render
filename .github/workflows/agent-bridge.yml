name: Agent bridge verification
on:
  pull_request:
  push:
    branches: [main, "feature/android-native-foundation-20261021"]
permissions:
  contents: read
jobs:
  relay-tests:
    if: github.head_ref != 'upgrade/render-studio-031'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: render_test
          POSTGRES_PASSWORD: render_test_local_only
          POSTGRES_DB: render_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U render_test -d render_test"
          --health-interval=5s --health-timeout=3s --health-retries=12
    env:
      TEST_POSTGRES_DSN: postgresql://render_test:render_test_local_only@localhost:5432/render_test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned relay requirements
        run: python -m pip install -r relay/requirements.txt
      - name: Test actual SQLite and HTTP protocol
        run: PYTHONPATH=relay python -m unittest discover -s relay/tests -v
      - name: Syntax check
        run: python -m compileall -q relay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-source-snapshot
          path: |
            relay/
            app/src/main/java/com/rezox/render/agent/
            app/src/main/AndroidManifest.xml
            tools/
            docs/superpowers/
          include-hidden-files: false
          retention-days: 7
