name: RENDER OMEGA ownership and P10 integration
on:
  pull_request:
    branches: [integration/render-omega-ten-phases-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce exact phase-owned paths
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$HEAD_BRANCH" == "integration/omega-combined-candidate-20261022" ]]; then
            python tools/omega/test_omega_integrated_ownership.py --base "$BASE_SHA" --head "$HEAD_SHA"
          elif [[ "$HEAD_BRANCH" =~ ^feature/omega-P(0[1-9]|1[0-3])-[a-z0-9-]+-20261022$ ]]; then
            python tools/omega/test_phase10_ownership.py --phase "$((10#${BASH_REMATCH[1]}))" --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            echo "::error::Unexpected phase or integrator branch"
            exit 1
          fi
  registry-host:
    if: startsWith(github.head_ref, 'feature/omega-P10-')
    needs: ownership
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/prepare_production_toolkit.py
      - name: Run host-only registry and ZIP tests
        run: PYTHONPATH=tools:full-app/scripts python -m unittest discover -s tools/omega -p 'test_phase10_*.py' -v
      - name: Check repeatable build adapter
        run: python tools/prepare_production_toolkit.py
  native-bpy:
    if: startsWith(github.head_ref, 'feature/omega-P10-')
    needs: ownership
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends blender
      - name: Execute actual bpy fixture (not mocks)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: /usr/bin/blender -b -noaudio --python-exit-code 1 --python tools/omega/test_phase10_bpy.py
  android-bridge:
    if: startsWith(github.head_ref, 'feature/omega-P10-')
    needs: ownership
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: python3 tools/prepare_production_toolkit.py
      - name: Android JVM/JNI tests; no install, signing or release
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
