plugins { id 'com.android.application' }

// Private release credentials remain in the owner's protected build environment.
def releaseKeystore = System.getenv('RENDER_ANDROID_SIGNING_STORE_FILE')
def releaseStorePassword = System.getenv('RENDER_ANDROID_SIGNING_STORE_PASSWORD')
def releaseKeyPassword = System.getenv('RENDER_ANDROID_SIGNING_KEY_PASSWORD')
def releaseAlias = System.getenv('RENDER_ANDROID_SIGNING_KEY_ALIAS')
def signingReady = releaseKeystore && releaseStorePassword && releaseKeyPassword && releaseAlias && new File(releaseKeystore).isFile()
def developmentKeystore = System.getenv('RENDER_DEVELOPMENT_KEYSTORE')

android {
    namespace 'org.blender.blender'
    compileSdk 35
    defaultConfig {
        applicationId 'com.rezox.render'
        if(project.hasProperty('renderSideBySide')) {
            applicationIdSuffix '.preview'
            versionNameSuffix '-side-by-side'
        }
        minSdk 31
        targetSdk 34
        testInstrumentationRunner 'com.rezox.render.qa.NativeStudioChecks'
        versionCode 43
        versionName '0.34.0-native-reference-motion'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets {
        main {
            manifest.srcFile '../stage/AndroidManifest.xml'
            java.srcDirs = ['src/main/java', '../../app/src/main/java', '../stage/java']
            jniLibs.srcDirs = ['../stage/lib']
            assets.srcDirs = ['../stage/assets']
            res.srcDirs = ['../stage/res', 'src/main/res']
        }
    }
    packagingOptions { jniLibs { useLegacyPackaging = true } }
    androidResources { noCompress 'zip' }
    signingConfigs {
        debug {
            if(developmentKeystore) {
                storeFile file(developmentKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        stableRelease {
            if(signingReady) {
                storeFile file(releaseKeystore)
                storeType 'pkcs12'
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug { debuggable true; signingConfig signingConfigs.debug }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            if(signingReady) signingConfig signingConfigs.stableRelease
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Never present an unsigned or silently re-signed release as an in-place upgrade.
tasks.configureEach { task ->
    if(task.name == 'preReleaseBuild') {
        doFirst {
            if(!signingReady) throw new GradleException('Protected permanent release signing is not configured; no release APK is emitted.')
        }
    }
}
